# Name of factory
name: Java Spring boot CI

# Triggering event
on:
  push:
    branches: ["main"]

# What should the factory do
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "termurin"
      
      - name: Build and run tests with Maven
        run: ./mvnw clean test
